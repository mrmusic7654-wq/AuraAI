name: Build Aura

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clean workspace
        run: |
          rm -rf ${{ github.workspace }}/*
          rm -rf ${{ github.workspace }}/.git

      - name: Checkout code (force fresh)
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - name: Verify checked out commit
        run: |
          echo "Checked out commit: $(git rev-parse HEAD)"
          echo "Line 523 content:"
          sed -n '520,530p' app/src/main/java/com/aura/ai/presentation/screens/agent/AgentViewModel.kt

      - name: Delete all Gradle caches
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf ~/.gradle/wrapper/
          rm -rf .gradle/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          cache-write-only: false

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --no-build-cache --stacktrace
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.caching=false"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AuraAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk
